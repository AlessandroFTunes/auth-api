services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: auth_api
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth_api"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASEURL: postgres://auth:${POSTGRES_PASSWORD}@db:5432/auth_api
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
    ports:
      - "${PORT:-3000}:3000"

volumes:
  pgdata:
